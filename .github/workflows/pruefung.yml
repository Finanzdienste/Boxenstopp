# Bei jedem Push: Linter, die Rezeptdaten und alle Browsertests.
name: Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    name: Linter und Tests
    # Fest auf 24.04: ubuntu-latest zieht seit Oktober 2026 nach und nach auf
    # Ubuntu 26 um, und dort schafft Playwright 1.56 die Pakete für Chromium nicht.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Linter
        run: npm run lint

      # Nur Chromium: Die App ist fürs Handy, und Chrome ist der Browser,
      # aus dem sie installiert wird. Bis zu drei Versuche: Ab und zu hakt
      # das Holen der Pakete, und dann liefen die Tests gar nicht erst.
      - name: Chromium für die Tests
        run: |
          for versuch in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Versuch $versuch hat nicht geklappt – gleich noch einmal"
            sleep 30
          done
          exit 1

      - name: Alle Tests
        run: node tests/lauf.mjs
