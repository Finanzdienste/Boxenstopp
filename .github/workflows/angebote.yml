# Montags und donnerstags früh: die Angebote der Woche holen (werkzeug/angebote.mjs)
# und daten/angebote.json einchecken; sonntags vormittags dazu, dann sind die
# Angebote der nächsten Woche bei allen Läden online. Von Hand: Actions → Angebote → Run workflow –
# dort lassen sich die Quellen einschränken und Lidl auf ein paar Seiten begrenzen
# (Probelauf, dauert dann nur Minuten).
#
# Lidl braucht einen Gemini-Schlüssel (Prospektseiten sind Bilder): als Secret
# GEMINI_KEY unter Settings → Secrets and variables → Actions anlegen. Ohne ihn
# läuft alles andere trotzdem.
#
# Danach kommt daten/preisverlauf.json dazu: je Zutat und Woche der günstigste
# Preis aus allen eingecheckten Fassungen (werkzeug/preisverlauf.mjs – darum
# die ganze Historie beim Auschecken).
name: Angebote

on:
  schedule:
    - cron: '23 4 * * 1,4'   # 05:23 bzw. 06:23 Berlin, Montag und Donnerstag
    - cron: '23 9 * * 0'     # 10:23 bzw. 11:23 Berlin, Sonntag: die nächste Woche
  workflow_dispatch:
    inputs:
      quellen:
        description: 'Nur diese Quellen, z. B. „lidl“ oder „aldi penny“ – leer: alle'
        required: false
        default: ''
      lidl_seiten:
        description: 'Probelauf: höchstens so viele Lidl-Seiten lesen – leer: alle Lebensmittel-Seiten'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: angebote
  cancel-in-progress: false

jobs:
  holen:
    name: Angebote holen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Angebote holen
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          LIDL_MAX: ${{ inputs.lidl_seiten }}
          QUELLEN: ${{ inputs.quellen }}
        run: node werkzeug/angebote.mjs $QUELLEN

      - name: Preisverlauf
        run: node werkzeug/preisverlauf.mjs

      - name: Einchecken
        run: |
          git config user.name "Boxenstopp-Bot"
          git config user.email "boxenstopp-bot@users.noreply.github.com"
          if git diff --quiet -- daten/angebote.json; then
            echo "Keine Änderung."
            exit 0
          fi
          WOCHE=$(node -e "console.log(require('./daten/angebote.json').woche)")
          ANZAHL=$(node -e "console.log(require('./daten/angebote.json').angebote.length)")
          git add daten/angebote.json daten/preisverlauf.json
          git commit -m "Angebote KW ${WOCHE#*-}: ${ANZAHL} Einträge"
          git pull --rebase origin main
          git push origin HEAD:main
