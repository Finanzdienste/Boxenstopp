; Die Firmware der Waage (src/main.cpp) – ein ESP32 DevKit mit HX711 und Wägezelle.
;
;   1. VS Code mit der Erweiterung „PlatformIO IDE“, diesen Ordner öffnen
;   2. include/config.example.h nach include/config.h kopieren und ausfüllen
;   3. ESP32 per USB anstecken, unten in der Leiste „Upload“ (der Pfeil),
;      danach „Serial Monitor“ (der Stecker) – dort kalibrieren (README.md)
;
; Mit der Arduino IDE geht es auch: src/main.cpp als Sketch, die Bibliothek
; „HX711“ von bogde über den Bibliotheksverwalter, Board „ESP32 Dev Module“.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  bogde/HX711@^0.7.5
build_flags = -DCORE_DEBUG_LEVEL=0
